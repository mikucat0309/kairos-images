name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: write
    steps:
      - name: Require a tag
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::error::run this workflow on a tag, not on ${GITHUB_REF}"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Build container image and bootable ISO
        run: just --set version "$GITHUB_REF_NAME" iso

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push container image to GHCR
        run: docker push "$(just --set version "$GITHUB_REF_NAME" --evaluate image)"

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/*.iso build/*.iso.sha256 \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
